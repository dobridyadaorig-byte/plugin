name: Paper Plugin Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Качаем чистое API из центрального репозитория, где файлы никогда не удаляют
    - name: Download Paper API from Maven Central
      run: |
        mkdir -p libs
        echo "Downloading stable Paper API..."
        curl -L -o libs/paper-api.jar "https://apache.org" || \
        curl -L -o libs/paper-api.jar "https://papermc.io"

    - name: Build Plugin JAR
      run: |
        mkdir -p out
        find . -name "*.java" > sources.txt
        
        if [ -s sources.txt ]; then
          # Компилируем проект, используя скачанное API
          javac -cp "libs/paper-api.jar" -d out @sources.txt
          
          # Закидываем plugin.yml в архив
          PLUGIN_YML=$(find . -name "plugin.yml" -print -quit)
          if [ -n "$PLUGIN_YML" ]; then
            cp "$PLUGIN_YML" out/
          else
            echo "Error: plugin.yml not found!" && exit 1
          fi
          
          # Закидываем config.yml, если есть
          CONFIG_YML=$(find . -name "config.yml" -print -quit)
          if [ -n "$CONFIG_YML" ]; then
            cp "$CONFIG_YML" out/
          fi
          
          # Создаем финальный плагин
          jar -cvf paper-plugin.jar -C out .
        else
          echo "Error: No .java files found!" && exit 1
        fi

    - name: Upload Plugin
      uses: actions/upload-artifact@v4
      with:
        name: paper-plugin-ready
        path: paper-plugin.jar
