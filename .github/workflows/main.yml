name: Manual Java Compile

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # Создаем папку для скомпилированных классов, компилируем и упаковываем в JAR
    - name: Compile and Jar
      run: |
        mkdir -p out
        javac -d out $(find . -name "*.java")
        jar -cvf my-plugin.jar -C out .

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: manual-jar-file
        path: my-plugin.jar
